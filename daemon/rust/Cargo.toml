[package]
name = "jarvis-execution-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fail-closed reference execution foundation for JARVIS X"

[features]
default = []
native = ["dep:xcap", "dep:enigo"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
xcap = { version = "0.9.8", optional = true }
enigo = { version = "0.6.1", optional = true }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[[bin]]
name = "jarvis-daemon"
path = "src/main.rs"
