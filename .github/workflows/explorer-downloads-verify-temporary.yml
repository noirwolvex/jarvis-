name: Verify Explorer Downloads fast path
on:
  push:
    branches:
      - fix/deterministic-explorer-downloads-2026-10-09
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q core app tests
      - name: Install test dependencies
        run: python -m pip install openai python-dotenv psutil Pillow "jsonschema>=4.23.0,<5" playwright
      - name: Test folder routing and mission execution
        run: python -m unittest tests.test_fast_mission tests.test_known_folder_tools tests.test_app_tools tests.test_full_access_recovery -v
      - name: Complete Python suite
        run: python -m unittest discover -s tests -p "test_*.py"
