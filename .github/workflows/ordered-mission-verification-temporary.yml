name: Verify ordered mission completion guard
on:
  push:
    branches: [fix/ordered-mission-completion-2026-10-09]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q core app tests
      - name: Install test prerequisites
        run: python -m pip install openai python-dotenv psutil Pillow "jsonschema>=4.23.0,<5" playwright
      - name: Run ordered action and autonomous regression tests
        run: python -m unittest tests.test_ordered_completion tests.test_full_access_recovery tests.test_workflow_execution tests.test_autonomous_orchestrator -v
      - name: Complete Python suite
        run: python -m unittest discover -s tests -p "test_*.py"
