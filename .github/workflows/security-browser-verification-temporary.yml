# Temporary cross-platform verification; remove after recording results.
name: Security and owned-browser qualification
on:
  push:
    branches:
      - fix/dependency-security-2026-10-09

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install reproducible npm tree
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Prisma validate
        run: npm run db:validate
      - name: Prisma generate
        run: npm run db:generate
      - name: TypeScript validation
        run: npm run typecheck
      - name: JavaScript tests
        run: npm test
      - name: Control Center build
        run: npm run build
      - name: Install Python orchestration dependencies
        run: python -m pip install openai python-dotenv psutil Pillow "jsonschema>=4.23.0,<5" playwright
      - name: Install isolated Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Python unit/regression suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Bind fixture to Playwright's isolated Chromium
        shell: bash
        run: |
          CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          echo "JARVIS_CHROME_EXE=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Qualify real CDP actions against owned loopback fixture
        run: python -m scripts.verify_browser_control
