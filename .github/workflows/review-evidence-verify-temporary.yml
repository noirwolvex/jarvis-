# One-time verification for review-evidence hardening; remove after run.
name: Verify action-review evidence gate
on:
  push:
    branches:
      - fix/review-evidence-gate-2026-10-09

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q core app tests
      - name: Install test dependencies
        run: python -m pip install openai python-dotenv psutil Pillow "jsonschema>=4.23.0,<5" playwright
      - name: Run evidence gate regression tests
        run: python -m unittest tests.test_autonomous_control tests.test_autonomous_orchestrator tests.test_task_tools tests.test_workflow_execution -v
      - name: Run complete Python suite
        run: python -m unittest discover -s tests -p "test_*.py"
