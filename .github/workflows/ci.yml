name: Jarvis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q core app tests
      - name: Install test dependencies
        run: python -m pip install openai python-dotenv psutil Pillow "jsonschema>=4.23.0,<5" playwright
      - name: Install isolated browser test runtime
        run: python -m playwright install --with-deps chromium
      - name: Run orchestration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
